name: Deploy to VPS
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 217.60.245.170
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/sambo-hero-tma
            git fetch origin
            git checkout master
            git pull --ff-only origin master
            docker compose up -d --build
            docker compose ps
